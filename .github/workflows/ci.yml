name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-preview-key
      PORT: "18080"
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the container
        run: |
          ./.hatchbox/build
          docker compose up --detach --no-build --remove-orphans --wait --wait-timeout 90
      - name: Check the running release
        run: |
          bin/check-deploy http://127.0.0.1:18080 "$REVISION"
          curl --fail --silent --show-error http://127.0.0.1:18080/ |
            python3 -c 'import json, sys; from pathlib import Path; guide = json.load(sys.stdin)["markdown"]; readme = Path("README.md").read_text(); assert guide == readme.split("<!-- api-guide:start -->", 1)[1].split("<!-- api-guide:end -->", 1)[0].strip(); assert "POST /preview" in guide and "Authorization: Bearer" in guide'
          docker compose exec -T web sh -c 'test "$(id -u)" = 10001'
          output="$(mktemp)"
          headers="$(mktemp)"
          url=http://127.0.0.1:18080/preview
          status="$(curl --silent --show-error --dump-header "$headers" --output "$output" \
            --write-out '%{http_code}' --header 'Content-Type: text/csv' --data-binary 'Item,Units' "$url")"
          test "$status" = 401
          grep -qi '^www-authenticate: bearer' "$headers"
          status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
            --header 'Authorization: Bearer wrong-key' --header 'Content-Type: text/csv' --data-binary 'Item,Units' "$url")"
          test "$status" = 401
          printf 'Item,Units\nCartons,120\n' |
            curl --fail --silent --show-error --header 'Content-Type: text/csv' \
              --header "Authorization: Bearer $API_KEY" --data-binary @- --output "$output" "$url"
          python3 -c 'import sys; assert open(sys.argv[1], "rb").read(8) == b"\x89PNG\r\n\x1a\n"' "$output"
          curl --fail --silent --show-error --header 'Content-Type: application/octet-stream' \
            --header "Authorization: Bearer $API_KEY" --data-binary @tests/fixtures/inventory.xlsx --output "$output" "$url"
          python3 -c 'import sys; assert open(sys.argv[1], "rb").read(8) == b"\x89PNG\r\n\x1a\n"' "$output"
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the container
        if: always()
        run: docker compose down --timeout 30
