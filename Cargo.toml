[package]
name = "spreadsheetpreview"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
axum = "0.8"
calamine = "0.38"
csv = "1.4"
libc = "0.2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
