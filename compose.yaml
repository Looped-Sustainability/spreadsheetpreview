name: spreadsheetpreview

services:
  web:
    build:
      context: .
      args:
        REVISION: ${REVISION:-${HATCHBOX_REVISION:-development}}
    image: spreadsheetpreview:latest
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
